# CS2 Demo 分析平台 - 全栈编排（计划书第九节）
# 服务：nginx / backend / worker / redis / postgres / minio
# 6R0.1：显式项目名，保证 docker compose ps / exec 默认命中 cs2demo
# 6R19B 硬化：
#   - 凭据一律由 gitignored 根目录 .env 注入（${VAR:?} 必填），本文件不含任何秘密。
#   - MinIO 仅绑定 127.0.0.1（不 0.0.0.0/:: 暴露到宿主）；对外只发布 nginx。
#   - MinIO/mc 镜像 pin 到本机实际 digest（不猜，先只读查元数据）。
#   - ENV=local（默认）→ 生产守卫跳过；生产用 docker-compose.prod.yml overlay（ENV=production 强制硬化）。
#   - RATE_LIMIT_TRUSTED_PROXIES 声明可信 nginx/内部代理，避免共桶或伪造绕限流。
name: cs2demo

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"   # 对外唯一入口
      # Windows/WSL 偶尔会用 wslrelay 抢占 localhost:80，导致 Vite dev proxy
      # 收到空响应并统一表现为 HTTP 500。保留既有 :80 产品入口，同时提供
      # 仅绑定 loopback 的稳定开发入口；production overlay 会 !reset 全部端口。
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      ENV: ${ENV:-local}
      DATABASE_URL: ${DATABASE_URL:?请在根目录 .env 配置 DATABASE_URL（不要提交秘密）}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 配置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 配置 MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-cs2demo}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 配置 JWT_SECRET（随机 ≥32 字节）}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      MAX_DEMO_SIZE_MB: ${MAX_DEMO_SIZE_MB:-300}
      # AI 报告（Phase 5B 接线；默认 fake + false，绝不触发真实请求）
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MAX_INPUT_TOKENS: ${DEEPSEEK_MAX_INPUT_TOKENS:-12000}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-3000}
      DEEPSEEK_CONNECT_TIMEOUT: ${DEEPSEEK_CONNECT_TIMEOUT:-10}
      DEEPSEEK_READ_TIMEOUT: ${DEEPSEEK_READ_TIMEOUT:-120}
      DEEPSEEK_TOTAL_TIMEOUT: ${DEEPSEEK_TOTAL_TIMEOUT:-130}
      MAX_REPORT_COST_CNY: ${MAX_REPORT_COST_CNY:-0.05}
      MONTHLY_BUDGET_CNY: ${MONTHLY_BUDGET_CNY:-10}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/config:/app/config
      - ./backend/tests/demos:/demos:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    environment:
      ENV: ${ENV:-local}
      DATABASE_URL: ${DATABASE_URL:?请在根目录 .env 配置 DATABASE_URL（不要提交秘密）}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 配置 MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 配置 MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-cs2demo}
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 配置 JWT_SECRET（随机 ≥32 字节）}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      MAX_DEMO_SIZE_MB: ${MAX_DEMO_SIZE_MB:-300}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MAX_INPUT_TOKENS: ${DEEPSEEK_MAX_INPUT_TOKENS:-12000}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-3000}
      DEEPSEEK_CONNECT_TIMEOUT: ${DEEPSEEK_CONNECT_TIMEOUT:-10}
      DEEPSEEK_READ_TIMEOUT: ${DEEPSEEK_READ_TIMEOUT:-120}
      DEEPSEEK_TOTAL_TIMEOUT: ${DEEPSEEK_TOTAL_TIMEOUT:-130}
      MAX_REPORT_COST_CNY: ${MAX_REPORT_COST_CNY:-0.05}
      MONTHLY_BUDGET_CNY: ${MONTHLY_BUDGET_CNY:-10}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/config:/app/config
      - ./backend/tests/demos:/demos:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD（不要提交秘密）}
      POSTGRES_DB: ${POSTGRES_DB:-cs2demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs2} -d ${POSTGRES_DB:-cs2demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # 6R19B：pin 到本机实际镜像 digest（只读查元数据，不猜）
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 配置 MINIO_ROOT_PASSWORD}
    # 仅绑定 127.0.0.1（本地管理可用），不暴露 0.0.0.0/:: 到宿主
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 配置 MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-cs2demo} &&
      echo 'MinIO bucket ready';
      "

volumes:
  pgdata:
  miniodata:
