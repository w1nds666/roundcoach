# Nginx：前端静态托管 + /api 反向代理到后端
# 分享 token 通过 POST body 解析，不进入 access log；按来源 IP 限速防枚举。
limit_req_zone $binary_remote_addr zone=share_resolve:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 6R21F-E6B-NAVMESH-PRODUCT-GATE：拒绝任何含路径穿越片段（..）的原始 URI（fail-closed）。
    # 否则 nginx 会在 location 匹配前把 `../..` 归一化到 /api/ 之外，落到下方 SPA 回退返回 200
    # index.html —— 该"伪装成功"会掩盖非法 map/路径穿越，故在此直接 404。
    # 合法请求（/api/maps/{map}/navmesh、/assets/*、SPA 路由）均不含 `..`，不受影响。
    if ($request_uri ~ "\.\.") {
        return 404;
    }

    # demo 上传：应用限制文件内容（默认 300MiB，可配置 MAX_DEMO_SIZE_MB）；
    # 此处留 multipart 开销余量（+5m），避免上限文件在 nginx 层被误拒（P1-2）
    client_max_body_size 305m;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /api/share/resolve {
        client_max_body_size 2k;
        limit_req zone=share_resolve burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @share_rate_limited;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @share_rate_limited {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 429 '{"detail":{"code":"SHARE_RATE_LIMITED","message":"访问过于频繁，请稍后再试"}}';
    }

    # API 反代（保留 /api 前缀，后端路由自带 /api）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8000;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
